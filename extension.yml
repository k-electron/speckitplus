schema_version: "1.0"
extension:
  id: "lifecycle"
  name: "SDLC Lifecycle State Tracker"
  version: "1.0.1"
  description: "Living SDLC state artifact tracker and workspace overview for Spec Kit features, bugs, and idea assessments"
  author: "Spec Kit Community"
  repository: "https://github.com/k-electron/speckitplus"
  license: "MIT"
  category: "lifecycle"
  effect: "read-write"
requires:
  speckit_version: ">=0.1.0"
provides:
  commands:
    - name: "speckit.lifecycle.status"
      file: "commands/speckit.lifecycle.status.md"
      description: "Display SDLC status and next recommended action for active feature or issue"
    - name: "speckit.lifecycle.overview"
      file: "commands/speckit.lifecycle.overview.md"
      description: "Compile and display repository-wide SDLC lifecycle overview dashboard"
  hooks:
    before_specify:
      command: "./scripts/hook-pre-command.sh specify"
      priority: 10
      optional: false
      description: "Record command start and detect interruptions in lifecycle artifact"
    after_specify:
      command: "./scripts/hook-post-command.sh specify $EXIT_CODE"
      priority: 10
      optional: false
      description: "Record specify completion in lifecycle artifact"
    before_clarify:
      command: "./scripts/hook-pre-command.sh clarify"
      priority: 10
      optional: false
      description: "Record command start and detect interruptions in lifecycle artifact"
    after_clarify:
      command: "./scripts/hook-post-command.sh clarify $EXIT_CODE"
      priority: 10
      optional: false
      description: "Record clarify completion in lifecycle artifact"
    before_checklist:
      command: "./scripts/hook-pre-command.sh checklist"
      priority: 10
      optional: false
      description: "Record command start and detect interruptions in lifecycle artifact"
    after_checklist:
      command: "./scripts/hook-post-command.sh checklist $EXIT_CODE"
      priority: 10
      optional: false
      description: "Record checklist completion in lifecycle artifact"
    before_plan:
      command: "./scripts/hook-pre-command.sh plan"
      priority: 10
      optional: false
      description: "Record command start and detect interruptions in lifecycle artifact"
    after_plan:
      command: "./scripts/hook-post-command.sh plan $EXIT_CODE"
      priority: 10
      optional: false
      description: "Record plan completion in lifecycle artifact"
    before_tasks:
      command: "./scripts/hook-pre-command.sh tasks"
      priority: 10
      optional: false
      description: "Record command start and detect interruptions in lifecycle artifact"
    after_tasks:
      command: "./scripts/hook-post-command.sh tasks $EXIT_CODE"
      priority: 10
      optional: false
      description: "Record tasks completion in lifecycle artifact"
    before_taskstoissues:
      command: "./scripts/hook-pre-command.sh taskstoissues"
      priority: 10
      optional: false
      description: "Record command start and detect interruptions in lifecycle artifact"
    after_taskstoissues:
