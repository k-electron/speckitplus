      priority: 10
      optional: false
      description: "Record command start and detect interruptions in lifecycle artifact"
    after_analyze:
      command: "./scripts/hook-post-command.sh analyze $EXIT_CODE"
      priority: 10
      optional: false
      description: "Record analyze completion in lifecycle artifact"
    before_implement:
