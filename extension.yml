      priority: 10
      optional: false
      description: "Record command start and detect interruptions in lifecycle artifact"
    after_implement:
      command: "./scripts/hook-post-command.sh implement $EXIT_CODE"
      priority: 10
      optional: false
      description: "Record implement completion in lifecycle artifact"
    before_converge:
